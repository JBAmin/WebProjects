<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Cargo & Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="/" class="logo">CARGO<span>&</span>CO.</a>
  <nav><a href="/">Storefront</a></nav>
</header>

<main class="container admin-panel">

  <div id="login-view">
    <h1>Admin login</h1>
    <form id="login-form">
      <div class="form-group">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" required>
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" required>
      </div>
      <p id="login-error" class="error-text"></p>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
  </div>

  <div id="dashboard-view" style="display:none;">
    <h1>Admin dashboard</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="import">Import product</button>
      <button class="tab-btn" data-tab="products">Products</button>
      <button class="tab-btn" data-tab="orders">Orders</button>
    </div>

    <section id="tab-import">
      <h3>Add manually</h3>
      <form id="manual-form">
        <div class="form-group"><label>Title</label><input type="text" id="m-title" required></div>
        <div class="form-group"><label>Description</label><input type="text" id="m-description"></div>
        <div class="form-group"><label>Category</label><input type="text" id="m-category"></div>
        <div class="form-row">
          <div class="form-group"><label>Cost price ($)</label><input type="number" step="0.01" id="m-cost"></div>
          <div class="form-group"><label>Sale price ($)</label><input type="number" step="0.01" id="m-price" required></div>
        </div>
        <div class="form-group"><label>Image URL</label><input type="text" id="m-image"></div>
        <div class="form-group"><label>Stock</label><input type="number" id="m-stock" value="10"></div>
        <button class="btn btn-primary" type="submit">Add product</button>
      </form>

      <h3 style="margin-top:2rem;">Import from AliExpress</h3>
      <p class="eyebrow">Requires AliExpress API credentials configured in the backend .env</p>
      <form id="ali-form">
        <div class="form-group"><label>AliExpress product URL</label><input type="text" id="a-url" placeholder="https://www.aliexpress.com/item/....html" required></div>
        <div class="form-group"><label>Your sale price ($)</label><input type="number" step="0.01" id="a-price" required></div>
        <div class="form-group"><label>Category</label><input type="text" id="a-category"></div>
        <button class="btn btn-primary" type="submit">Import product</button>
      </form>
      <p id="import-result" style="margin-top:0.8rem;"></p>
    </section>

    <section id="tab-products" style="display:none;">
      <table class="admin-table" id="products-table">
        <thead><tr><th>ID</th><th>Title</th><th>Source</th><th>Price</th><th>Stock</th><th>Active</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="tab-orders" style="display:none;">
      <table class="admin-table" id="orders-table">
        <thead><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
