<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Cargo & Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>

<header class="site-header">
  <a href="/" class="logo">CARGO<span>&</span>CO.</a>
  <nav>
    <a href="/">Shop</a>
    <a href="/cart.html">Cart<span id="cart-count" class="cart-count" style="display:none">0</span></a>
  </nav>
</header>

<main class="container">
  <h1>Checkout</h1>
  <div class="checkout-grid">
    <form id="checkout-form">
      <h3>Contact</h3>
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>

      <h3>Shipping address</h3>
      <div class="form-group">
        <label for="line1">Address</label>
        <input type="text" id="line1" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" required>
        </div>
        <div class="form-group">
          <label for="state">State / Province</label>
          <input type="text" id="state" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="postal_code">Postal code</label>
          <input type="text" id="postal_code" required>
        </div>
        <div class="form-group">
          <label for="country">Country (2-letter code)</label>
          <input type="text" id="country" placeholder="US" maxlength="2" required>
        </div>
      </div>

      <h3>Payment</h3>
      <div id="card-element"></div>
      <p id="payment-error" class="error-text"></p>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.2rem;" id="pay-btn">
        Pay & place order
      </button>
    </form>

    <div id="order-summary" class="cart-summary"></div>
  </div>

  <div id="confirmation" style="display:none;"></div>
</main>

<footer>Cargo & Co. — a demo storefront scaffold.</footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
